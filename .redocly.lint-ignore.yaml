# Known exceptions to the Redocly lint rules; every other problem fails CI.
#   operation-2xx-response: POST /v1/languages is registered by Joomla but not implemented.
#   no-required-schema-properties-undefined, no-illogical-composition-keywords: false positives
#     (content is defined in the media upload request; the two media responses differ by data type).
#   no-unused-components: reference schemas of Joomla's form, menu-view and plugin-parameter XML files.
# Regenerate with "npx redocly lint src/joomla-ws-api.json --generate-ignore-file" only after
# checking each new problem.
