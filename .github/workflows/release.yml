name: Release

# Push a tag that equals info.version of src/joomla-ws-api.json, for instance 6.2.1:
#   git tag -a 6.2.1 -m "Joomla Web Services API 6.2.1" && git push origin 6.2.1
# The release gets the files joomla-ws-api-<version>.json, .yaml, .html and .sha256.
# The highest version becomes the "latest" release:
#   https://api.github.com/repos/joomla-projects/API-Endpoints/releases/latest

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: node scripts/build.mjs --tag "$GITHUB_REF_NAME"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$GITHUB_REF_NAME" '
            $0 == "## " v || index($0, "## " v " ") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "Download: [joomla-ws-api-${GITHUB_REF_NAME}.json](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/joomla-ws-api-${GITHUB_REF_NAME}.json)"
          } >> notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          highest=$(git ls-remote --tags --refs origin | sed 's|.*refs/tags/||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          latest=false
          [ "$highest" = "$GITHUB_REF_NAME" ] && latest=true
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Joomla Web Services API $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --latest="$latest"
